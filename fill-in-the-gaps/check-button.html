<!-- BOTÓN VALIDAR V3.2 - HÍBRIDO PERFECTO -->
<!-- Mantiene feedback letra a letra y animaciones, pero usa la lógica visual robusta del original -->

<div style="width:100%; height:100%; cursor:pointer;" id="BoutonValidation">
	<div style="width:100%; height:100%; background:transparent;"></div>
</div>

<script>
	// --- TUS VARIABLES ---
	var solution = ["test"];
	var ordre = 1; var espace = 1; var casse = 0; var correct = 1;
	var tentative = 0; var maxtentative = 0; var unefois = 0;

	// --- FUNCIONES HELPER ORIGINALES (Para asegurar compatibilidad visual) ---
	function getParent(name) {
		var el = document.getElementById(name);
		if (!el) return null;
		var pnode = el.parentNode.parentNode.parentNode;
		while (pnode && pnode.getAttribute('id') == null) { pnode = pnode.parentNode; }
		return pnode ? pnode.parentNode.parentNode : null;
	}

	// Función Helper Mía para encontrar todos los widgets
	function toggleAll(cls, show) {
		var els = document.querySelectorAll(cls);
		for (var i = 0; i < els.length; i++) {
			// Subir niveles hasta encontrar el contenedor ocultable de Genially
			var p = els[i];
			// Intentamos subir 4 o 5 niveles como hace el script original
			try {
				if (p.closest('.genially-view-item')) {
					p.closest('.genially-view-item').style.display = show ? 'block' : 'none';
				} else {
					// Fallback manual si closest no va o estructura rara
					p.parentNode.parentNode.parentNode.parentNode.parentNode.style.display = show ? 'block' : 'none';
				}
			} catch (e) { }
		}
	}

	(function () {
		var btn = document.getElementById('BoutonValidation');
		btn.addEventListener('click', function (e) {
			e.stopPropagation();
			validar();
		});

		function validar() {
			// 1. LIMPIEZA TOTAL (Al estilo original)
			if (document.getElementById('boncouise')) {
				var p = getParent('boncouise');
				if (p) p.style.display = "none";
			}
			if (document.getElementById('erreurcouise')) {
				var p = getParent('erreurcouise');
				if (p) p.style.display = "none";
			}
			if (document.getElementById('masquecouise')) {
				var p = getParent('masquecouise');
				if (p) p.style.display = "none";
			}

			// Limpiar clases globales también
			toggleAll('.boncouise', false);
			toggleAll('.erreurcouise', false);
			toggleAll('.masquecouise', false);

			// 2. DETECTAR ACTIVIDAD (Nuestra logica mejorada)
			let actId = window.lastInteractedActivity || window.currentActivityId;
			if (!actId) {
				var inp = document.querySelector('input.question');
				if (inp) actId = inp.getAttribute('data-activity-id');
			}
			if (!actId) actId = 'act1'; // Fallback

			// 3. VALIDAR (Nuestra lógica mejorada + Feedback Letras)
			var faux = 0;
			var reponse = [];

			for (var i = 1; i <= solution.length; i++) {
				var el = document.getElementById(actId + '_resp' + i) || document.getElementById('q' + i);
				var val = el ? el.value : "";
				if (espace == 1) val = val.trim();
				reponse.push(val);

				// Color Reset
				if (el) el.style.color = '';

				// Comparar
				var sol = solution[i - 1];
				var uVal = val;
				if (casse != 1) { sol = sol.toUpperCase(); uVal = uVal.toUpperCase(); }

				var isRight = false;
				var alts = sol.split('|');
				if (alts.indexOf(uVal) !== -1) isRight = true;

				if (!isRight) {
					faux = 1;
					if (correct == 1 && el) {
						el.style.color = 'red';
						// AQUÍ RECUPERAMOS EL FEEDBACK LETRA A LETRA
						if (window.showCharFeedback) window.showCharFeedback(el.id, reponse[i - 1], solution[i - 1]);
					}
				} else {
					if (correct == 1 && el) {
						el.style.color = 'green';
						if (window.removeCharFeedback) window.removeCharFeedback(el.id);
					}
				}
			}

			// 4. MOSTRAR RESULTADO (Lógica Original Visual)
			setTimeout(function () {
				if (faux == 1) {
					if (document.getElementById('erreurcouise')) {
						var p = getParent('erreurcouise');
						if (p) p.style.display = "block";
					}
					if (document.getElementById('masquecouise')) {
						var p = getParent('masquecouise');
						if (p) p.style.display = "block";
					}
					toggleAll('.erreurcouise', true);
					toggleAll('.masquecouise', true);

					// Disparar evento de incorrección (para animaciones custom)
					if (window.FITG && window.FITG.updateFeedback) window.FITG.updateFeedback(actId, false);

				} else {
					if (document.getElementById('boncouise')) {
						var p = getParent('boncouise');
						if (p) p.style.display = "block";
					}
					toggleAll('.boncouise', true);

					// Disparar evento de corrección
					if (window.FITG && window.FITG.updateFeedback) window.FITG.updateFeedback(actId, true);
				}
			}, 100);
		}
	})();
</script>
