  // Function to get fill color of ellipse
  function getEllipseFillColor() {
    const svgElement = document.querySelector('.colorPicker[data-autor="ocw"] svg');
    if (svgElement) {
      const ellipseElement = svgElement.querySelector('ellipse.color1');
      if (ellipseElement) {
        return ellipseElement.getAttribute('fill');
      }
    }
    return null; // Return null if the element or attribute is not found
  }

		}
		pnode = pnode.parentNode.parentNode;
		return (pnode);
	}

			else{

				var correspondance=0;
				var alternative = solution[a].split('|');
				for (var x = 0; x < alternative.length; x++)
				{

				}
