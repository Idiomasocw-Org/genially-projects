  // Function to get fill color of ellipse-Función para obtener el color de relleno de la elipse,consultar qué color se utilizó para rellenar una forma elíptica en una interfaz
  function getEllipseFillColor() {
    const svgElement = document.querySelector('.colorPicker[data-autor="ocw"] svg');
    if (svgElement) {
      const ellipseElement = svgElement.querySelector('ellipse.color1');
      if (ellipseElement) {
        return ellipseElement.getAttribute('fill');
      }
    }
    return null; // Return null if the element or attribute is not found-Devolver null si no se encuentra el elemento o el atributo
  }
