<!-- 
  🎵 GUÍA DE USO - AUDIO COLOR WIDGET (V13 HÍBRIDO) 🎵
  ----------------------------------------------------
  OPCIÓN A: MODO VISUAL (Sin código)
    1. Agrupa este widget con tu Audio.
    2. Añade 4 figuras de color agrupadas en orden (Izq->Der):
       [Fondo] [Botón] [Barra] [Texto]
  
  OPCIÓN B: MODO CÓDIGO (Manual)
    1. Edita este HTML y añade atributos al div principal:
       data-audio-bg-color="#000000"
       data-audio-btn-color="#ff0000"
       data-audio-prog-color="#00ff00"
       data-audio-text-color="#ffffff"
    2. Agrupa el widget con el audio (no necesitas figuras).
-->
<div id="custom-audio-player"
  style="width:100%; height:100%; display:flex; justify-content:center; align-items:center;">
  <span style="font-family:sans-serif; font-size:11px; color:#555; opacity:0.6; user-select:none;">
    Audio Color Widget V13
  </span>
</div>

<style>
  .widget-audio-player-customized * {
    transition: all 0.3s ease;
  }
</style>

<script>
  /* --------------------------------------------------------------
     PLUGIN CUSTOM AUDIO PLAYER V13.0 - HYBRID MODE
     -------------------------------------------------------------- */
  (function () {
    if (window.location.pathname.split('/')[1] !== 'editor') {
      document.querySelectorAll('[id^="custom-audio-player"]').forEach(w => w.style.display = 'none');
    }

    const log = (msg) => console.log(`[AUDIO V13] ${msg}`);

    const extractColor = (el) => {
      if (!el) return null;
      const tag = el.tagName.toUpperCase();
      if (tag === 'SVG') return null; // Ignorar contenedores SVG

      const style = window.getComputedStyle(el);
      const ignore = ['rgba(0, 0, 0, 0)', 'transparent', 'none', 'currentColor', 'inherit'];

      // 1. Fill
      if (['PATH', 'RECT', 'CIRCLE', 'ELLIPSE', 'POLYGON'].includes(tag)) {
        const fill = el.getAttribute('fill') || style.fill;
        if (fill && !ignore.includes(fill)) return fill;
      }
      // 2. Background
      const bg = style.backgroundColor;
      if (bg && !ignore.includes(bg)) {
        if (tag === 'DIV' && !el.className && bg === 'rgb(0, 0, 0)') return null;
        return bg;
      }
      return null;
    };

    const applyStyles = (player, colors) => {
      if (!player) return;
      player.classList.add('widget-audio-player-customized');
      player.setAttribute('data-custom-initialized', 'true');

      // Helper para obtener color seguro (si falta uno, usa el último disponible)
      const getC = (i) => colors[i] || colors[colors.length - 1];

      // 1. Fondo
      if (colors[0]) {
        player.style.setProperty('background-color', colors[0], 'important');
        player.style.setProperty('background', colors[0], 'important');
      }
      // 2. Botones
      if (colors[1]) {
        const cBtn = getC(1);
        const cTxt = colors[3] || '#fff'; // Texto dentro del botón (usa el color de texto general si hay, o blanco)
        player.querySelectorAll('button, .audio-button, div[role="button"]').forEach(b => {
          b.style.setProperty('background-color', cBtn, 'important');
          b.style.setProperty('color', cTxt, 'important');
          b.querySelectorAll('svg, path').forEach(i => i.style.setProperty('fill', cTxt, 'important'));
        });
      }
      // 3. Barra
      if (colors[2]) {
        const cProg = getC(2);
        player.querySelectorAll('input[type="range"], progress').forEach(b => {
          b.style.setProperty('accent-color', cProg, 'important');
          b.style.setProperty('color', cProg, 'important');
        });
        const uid = 's-' + Math.random().toString(36).slice(2);
        player.setAttribute('data-sid', uid);
        const st = document.createElement('style');
        st.innerHTML = `
          [data-sid="${uid}"] input[type="range"]::-webkit-slider-thumb { background: ${cProg} !important; }
          [data-sid="${uid}"] .audio-progress-fill { background-color: ${cProg} !important; }
        `;
        document.head.appendChild(st);
      }
      // 4. Texto
      if (colors[3]) {
        const cTx = getC(3);
        player.style.setProperty('color', cTx, 'important');
        player.querySelectorAll('*:not(button *)').forEach(el => el.style.setProperty('color', cTx, 'important'));
        player.querySelectorAll('svg:not(button svg)').forEach(s => s.style.setProperty('fill', cTx, 'important'));
      }
    };

    const init = () => {
      const configs = document.querySelectorAll('[id^="custom-audio-player"]');

      configs.forEach(config => {
        // --- MODO MANUAL (Data Attributes) ---
        const manualBg = config.getAttribute('data-audio-bg-color');
        const manualBtn = config.getAttribute('data-audio-btn-color');
        const manualProg = config.getAttribute('data-audio-prog-color');
        const manualText = config.getAttribute('data-audio-text-color');

        // Buscar grupo y audio...
        let wrapper = config;
        while (wrapper.parentElement && wrapper.parentElement.tagName !== 'BODY' && !wrapper.parentElement.classList.contains('genially-view-item')) {
          wrapper = wrapper.parentElement;
        }

        let parent = config.parentNode;
        let group = null;
        let audio = null;

        for (let i = 0; i < 20; i++) {
          if (!parent || parent.tagName === 'BODY') break;
          const foundAudio = parent.querySelector('.widget-audio-player');
          if (foundAudio) {
            audio = foundAudio;
            group = parent;
            break;
          }
          parent = parent.parentNode;
        }

        if (group && audio) {
          // 1. CHEQUEO PRIORITARIO: ¿Hay colores manuales?
          if (manualBg || manualBtn || manualProg || manualText) {
            log('Detectada configuración manual por atributos.');
            const manualPalette = [
              manualBg,
              manualBtn,
              manualProg,
              manualText
            ].filter(c => c); // Filtrar nulos

            // Reconstruir array completo rellenando huecos si es necesario
            // (Simplemente pasamos el array disperso, applyStyles se encarga del fallback)
            const finalManual = [];
            if (manualBg) finalManual[0] = manualBg;
            if (manualBtn) finalManual[1] = manualBtn;
            if (manualProg) finalManual[2] = manualProg;
            if (manualText) finalManual[3] = manualText;

            applyStyles(audio, finalManual);
            return; // ¡TERMINAMOS AQUÍ PARA ESTE WIDGET! No escaneamos visualmente.
          }

          // 2. MODO VISUAL (Si no hubo manual)
          const allNodes = Array.from(group.querySelectorAll('*'));
          let visualObjects = [];

          allNodes.forEach(node => {
            if (audio.contains(node)) return;
            if (config.contains(node) || node === config) return;
            if (wrapper.contains(node) || node === wrapper) return;
            if (['SCRIPT', 'STYLE', 'LINK', 'META', 'HEAD'].includes(node.tagName)) return;

            const color = extractColor(node);
            if (color) {
              const rect = node.getBoundingClientRect();
              if (rect.width > 2 && rect.height > 2) {
                // log(`Visual: ${color} en ${node.tagName}`);
                visualObjects.push({ color: color, x: rect.left });
              }
            }
          });

          // Ordenar visualmente
          visualObjects.sort((a, b) => a.x - b.x);

          // Filtrar paleta
          let palette = [];
          visualObjects.forEach(obj => {
            if (palette.length === 0 || palette[palette.length - 1] !== obj.color) {
              palette.push(obj.color);
            }
          });
          palette = [...new Set(palette)];

          if (palette.length > 0) {
            applyStyles(audio, palette);
          }
        }
      });
    };

    setTimeout(init, 500);
    setInterval(init, 3000);
  })();
</script>
