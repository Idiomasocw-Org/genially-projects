<div id="custom-audio-player"
  style="color:black; background-color:#D5B9B2; text-align:center; font-weight:normal; font-size:16px; width:100%; height:100%;">
  Custom audio-player
</div>

<style>
  /* Color de fondo por defecto del reproductor (puedes cambiar el valor HEX entre los signos # y !). */
  .widget-audio-player {
    background-color: #5647ff !important;
  }
</style>

<script>
  /* --------------------------------------------------------------
     PLUGIN CUSTOM AUDIO PLAYER V2.0 - PERSONALIZACIÓN AVANZADA
     • Oculta el widget cuando la presentación está en modo "presentación"
     • Permite personalizar múltiples aspectos visuales mediante atributos data-*:
       - data-audio-bg-color: Color de fondo del reproductor
       - data-audio-button-color: Color de los botones (play, pause, etc.)
       - data-audio-progress-color: Color de la barra de progreso
       - data-audio-text-color: Color del texto e iconos
     • Mantiene compatibilidad con el método anterior (CSS)
     • Los atributos data-* tienen prioridad sobre los estilos CSS
     -------------------------------------------------------------- */

  // --------------------------------------------------------------
  // 1️⃣ Ocultar el widget en modo presentación (no editor)
  // --------------------------------------------------------------
  const urlParts = window.location.pathname.split('/')
  const refGenially = urlParts[1]
  if (refGenially !== 'editor') {
    const widget = document.getElementById('custom-audio-player')
    if (widget) widget.style.display = 'none'
  }

  // --------------------------------------------------------------
  // 2️⃣ Función que extrae el color de fondo del CSS (método legacy)
  // --------------------------------------------------------------
  const getBackgroundColor = () => {
    const styleEl = document.querySelector('style')
    if (!styleEl) return null

    const css = styleEl.textContent || styleEl.innerText
    const match = css.match(/background-color\s*:\s*(#[0-9A-Fa-f]{6}|#[0-9A-Fa-f]{3})\s*!/i)
    return match ? match[1] : null
  }

  // --------------------------------------------------------------
  // 3️⃣ Buscar el widget iniciador y extraer colores personalizados
  // --------------------------------------------------------------
  const getCustomColors = () => {
    // Buscar elemento con id que comience con "custom-audio-player"
    const initWidget = document.querySelector('[id^="custom-audio-player"]')

    if (!initWidget) {
      console.log('📻 [AUDIO] No se encontró widget iniciador, usando CSS por defecto')
      return null
    }

    // Extraer atributos data-*
    const bgColor = initWidget.getAttribute('data-audio-bg-color')
    const buttonColor = initWidget.getAttribute('data-audio-button-color')
    const progressColor = initWidget.getAttribute('data-audio-progress-color')
    const textColor = initWidget.getAttribute('data-audio-text-color')

    // Si hay al menos un atributo, devolver objeto de configuración
    if (bgColor || buttonColor || progressColor || textColor) {
      console.log('🎨 [AUDIO] Colores personalizados detectados:', {
        fondo: bgColor || 'default',
        botones: buttonColor || 'default',
        progreso: progressColor || 'default',
        texto: textColor || 'default'
      })

      return {
        background: bgColor,
        button: buttonColor,
        progress: progressColor,
        text: textColor
      }
    }

    return null
  }

  // --------------------------------------------------------------
  // 4️⃣ Aplicar estilos personalizados a los reproductores
  // --------------------------------------------------------------
  const applyCustomStyles = () => {
    const customColors = getCustomColors()
    const players = document.querySelectorAll('.widget-audio-player')

    console.log('📻 [AUDIO] Reproductores encontrados:', players.length)

    if (players.length === 0) {
      console.warn('⚠️ [AUDIO] No se encontraron reproductores')
      return
    }

    players.forEach((player, index) => {
      console.log(`🎵 [AUDIO] Aplicando estilos al reproductor #${index + 1}`)

      // Si hay colores personalizados, usarlos
      if (customColors) {
        // Color de fondo del reproductor
        if (customColors.background) {
          player.style.setProperty('background-color', customColors.background, 'important')
          player.style.setProperty('background', customColors.background, 'important')
        }

        // Color de los botones (play, pause, etc.)
        if (customColors.button) {
          const buttons = player.querySelectorAll('button, .audio-button, [class*="button"]')
          buttons.forEach(btn => {
            btn.style.setProperty('background-color', customColors.button, 'important')
            btn.style.setProperty('color', customColors.text || '#ffffff', 'important')
          })

          // También aplicar a los iconos SVG dentro de botones
          const svgIcons = player.querySelectorAll('button svg, .audio-button svg')
          svgIcons.forEach(svg => {
            svg.style.setProperty('fill', customColors.text || '#ffffff', 'important')
          })
        }

        // Color de la barra de progreso
        if (customColors.progress) {
          const progressBars = player.querySelectorAll(
            'progress, .audio-progress, [class*="progress"], input[type="range"]'
          )
          progressBars.forEach(bar => {
            // Para barras de progreso estándar
            bar.style.setProperty('accent-color', customColors.progress, 'important')

            // Para elementos personalizados
            bar.style.setProperty('background-color', customColors.progress, 'important')
          })

          // Estilos específicos para el fill de la barra de progreso
          const progressFills = player.querySelectorAll(
            '.audio-progress-fill, [class*="progress-fill"], [class*="progress-bar"]'
          )
          progressFills.forEach(fill => {
            fill.style.setProperty('background-color', customColors.progress, 'important')
          })
        }

        // Color del texto e iconos
        if (customColors.text) {
          player.style.setProperty('color', customColors.text, 'important')

          // Aplicar a spans, divs de texto, etc.
          const textElements = player.querySelectorAll('span, div, p, time')
          textElements.forEach(el => {
            el.style.setProperty('color', customColors.text, 'important')
          })

          // Aplicar a iconos SVG
          const svgs = player.querySelectorAll('svg')
          svgs.forEach(svg => {
            svg.style.setProperty('fill', customColors.text, 'important')
          })
        }

      } else {
        // Método legacy: usar color del CSS
        const bgColor = getBackgroundColor()
        if (bgColor) {
          console.log('🎨 [AUDIO] Usando color CSS legacy:', bgColor)
          player.style.setProperty('background-color', bgColor, 'important')
          player.style.setProperty('background', bgColor, 'important')
        } else {
          console.warn('⚠️ [AUDIO] No se encontró configuración de color')
        }
      }
    })

    console.log('✅ [AUDIO] Estilos aplicados correctamente')
  }

  // --------------------------------------------------------------
  // 5️⃣ Ejecutar la aplicación después de que Genially haya cargado
  // --------------------------------------------------------------
  setTimeout(applyCustomStyles, 500)

  // Observar cambios en el DOM por si se agregan reproductores dinámicamente
  const observer = new MutationObserver(() => {
    const players = document.querySelectorAll('.widget-audio-player')
    if (players.length > 0) {
      applyCustomStyles()
    }
  })

  observer.observe(document.body, {
    childList: true,
    subtree: true
  })
</script>
