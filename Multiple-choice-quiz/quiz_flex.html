			getScore(n){
				return parseInt(this.scorePoints[n]) || 0;
			},
			
			animateScore (targetScore, scoreObject, n){
				var actScore = parseInt(scoreObject.innerText);
				var diff = parseInt(targetScore - actScore);
				diff = (diff > 0 ? diff : Math.abs(diff));
				var paso = Math.floor(Math.max(diff/20, 1));
				if(actScore < targetScore){
					
					actScore = (actScore + paso <= targetScore ? actScore + paso : targetScore);
					scoreObject.innerText = actScore;
				}
				
				if (actScore >= targetScore){
					
					scoreObject.innerText = targetScore;
					clearInterval(intervalUpdate[n]);
				} else {}
				
			},
			
			slideScore (scoreObject, targetScore, n){
				var actScore = parseInt(scoreObject.innerText);
				if(parseInt(targetScore - actScore) > 0){
					//clonamos el marcador para mostrar los puntos ganados y animarlo
					var scoreClone = scoreObject.closest('div.genially-animated-wrapper').cloneNode(true);
					scoreObject.closest('div.genially-animated-wrapper').parentNode.appendChild(scoreClone);
					var txtScoreClone = scoreClone.querySelector(".scoreTxt");
					txtScoreClone.innerText = "+" + parseInt(targetScore - actScore);
					//Buscamos todos los elementos del grupo que no queremos animar y los ocultamos
					var locateNode = scoreClone;
					while(locateNode.childNodes.length == 1){
						locateNode = locateNode.firstChild;	
					}
					var hiddenSiblings = locateNode.childNodes;
					for(var k = 0; k < hiddenSiblings.length; k++){
						if(!hiddenSiblings[k].querySelector(".scoreTxt")){
							hiddenSiblings[k].style.visibility = "hidden";
						}
					}
					
					scoreClone.firstChild.classList.add("scoreAnimation");
					var prevInterval = intervalUpdate[n];
					intervalUpdate[n] = setInterval(this.animateScore, 20, targetScore, scoreObject, n);
					if(intervalUpdate[n] != prevInterval){
						clearInterval(prevInterval);
					}
					setTimeout(function (){
						var clones = document.querySelectorAll(".scoreAnimation");
						for(var i = 0; i < clones.length; i++){
							clones[i].parentNode.remove();
						}
						
						clearInterval(intervalUpdate[n]);
						scoreObject.innerText = targetScore;
					},2000);
				}
			},
			
			updateScores () {
				for(var i = 0; i < numJugadores; i++){
					
					if(this.scores[i] && parseInt(this.scores[i].innerText) != parseInt(this.getScore(i))){
						
						var targetScore = parseInt(this.getScore(i));
						var scoreObject = this.scores[i];						
						this.slideScore (scoreObject, targetScore, 0);
					}
					
					if(this.hits[i] && parseInt(this.hits[i].innerText) != parseInt(this.getScore(i))){
						
						var targetScore = parseInt(this.scoreHits[i]);
						var scoreObject = this.hits[i];						
						this.slideScore (scoreObject, targetScore, 1);
					}
				}
			},
			
			preloadScores () {
				
				var textos = page.querySelectorAll(".genially-view-text, div[data-cy=text-item], div[data-cy=textItemView]");
				for (var e = 0; e < textos.length; e++)
				{
					if (/\$SCORE\d+/.test(textos[e].innerText)) {
						var scoreIndex = Math.abs(parseInt(textos[e].innerText.match(/\d+/))) || 1;
						this.scores[scoreIndex - 1] = obtenTextoHijo(textos[e].parentNode);
						this.scores[scoreIndex - 1].setAttribute("class", "scoreTxt");
					}
										
					if (/\$HITS\d+/.test(textos[e].innerText)) {
						var scoreIndex = Math.abs(parseInt(textos[e].innerText.match(/\d+/))) || 1;
						this.hits[scoreIndex - 1] = obtenTextoHijo(textos[e].parentNode);
						this.hits[scoreIndex - 1].setAttribute("class", "scoreTxt");
					}
					
					if (/\$T\d+/.test(textos[e].innerText)){
						var scoreIndex = Math.abs(parseInt(textos[e].innerText.match(/\d+/))) || 1;
						this.cronosUsuarios[scoreIndex - 1] = obtenTextoHijo(textos[e].parentNode);
						this.cronosUsuarios[scoreIndex - 1].setAttribute("class", "timerUserTxt");
					}
				}
				numJugadores = Math.max(this.scores.length, this.hits.length, 1);
				this.resetScores();
				this.changePlayer ();				
			},
			
			hitScore (n) {
				this.scoreRally[n]++;
				this.scoreHits[n]++;
				var timeElapsed = new Date().getTime() - questionTimer.getTime();
				var timeBonus = Math.max(0, (60000 - timeElapsed) / 1000) * 0.01;
				var actMultiplier = this.scoreMultiplier[n] + Math.floor(this.scoreRally[n] / 5) * .5 + (this.scoreHits[n] * .2) + timeBonus;
				this.scoreMultiplier[n] += Math.floor((this.scoreRally[n] / 5 * .5) + (this.scoreHits[n] * .2));
				this.scorePoints[n] = Math.ceil(this.scorePoints[n] + actMultiplier * 100 + 100);
				
				this.updateScores();
			},
			
			resetRally (n){
				this.scoreRally[n] = 0;
				
				this.changePlayer ();
			},
			
			getParamNumber (node, defaultVal, tag) {
				var textos = node.querySelectorAll(".genially-view-text, div[data-cy=text-item], div[data-cy=textItemView]");
				var param = defaultVal;
				var lastDiv;
				for (var e = 0; e < textos.length; e++)
				{
					if (/\d+/.test(textos[e].innerText)) {
						param = parseInt(textos[e].innerText.match(/\d+/));
						lastDiv = textos[e];
						while (lastDiv.lastChild)
						{
							lastDiv = lastDiv.lastChild;
						}
						lastDiv = lastDiv.parentNode;
						lastDiv.setAttribute("class", tag);
		
						
					}					
				}
				if(lastDiv && param == Number.MAX_VALUE){lastDiv.style.display = "none";}
				return [param, lastDiv];
			},
			
			resetScores (){
				for (var scoreIndex = 0; scoreIndex < numJugadores; scoreIndex++)
				{
					this.scorePoints[scoreIndex] = 0;
					if(this.scores[scoreIndex]){this.scores[scoreIndex].innerText = this.scorePoints[scoreIndex];}
					this.scoreMultiplier[scoreIndex] = 1;
					this.scoreRally[scoreIndex] = 0;
					this.scoreHits[scoreIndex] = 0;
					this.bestScorePoints[scoreIndex] = this.bestScorePoints[scoreIndex] || 0;
					this.bestScoreHits[scoreIndex] = this.bestScoreHits[scoreIndex] || 0;
					this.scoreErrors[scoreIndex] = 0;
					if(this.hits[scoreIndex]){this.hits[scoreIndex].innerText = this.scoreHits[scoreIndex];}
					if(this.cronosUsuarios[scoreIndex]){this.cronosUsuarios[scoreIndex].innerText = 0; this.cronosUsuarios[scoreIndex].style.display = "none"}
					var nextButtonParam;

							}
							marcadores.cronosUsuarios[jugadorActual].innerText = Math.floor(diferencia / 1000).toString() + "." + Math.floor(diferencia % 1000).toString().substring(0,1);

			maxScore () {

				for (var scoreIndex = 0; scoreIndex < this.scorePoints.length; scoreIndex++)
				{
					this.bestScoreHits[scoreIndex] = Math.max(this.bestScoreHits[scoreIndex], this.scoreHits[scoreIndex]);
					this.bestScorePoints[scoreIndex] = Math.max(this.bestScorePoints[scoreIndex], this.scorePoints[scoreIndex]);
					
					if(this.scorePoints[scoreIndex] == maxVal) {

		function transform(texte)
		{
		
			var decoupe=texte.split("§");
			var resultat="";
			for (var i=0;i<decoupe.length;i++)
			{
				if (i%2==0)
				{
					resultat += decoupe[i];
				}
				else
				{
					var inter=decoupe[i].split("|");
					if (inter.length==1)
					{
						resultat += localStorage.getItem('var_' + inter[0] + "_" + referencia);
					}
					else if (inter.length==3)
					{
						if (localStorage.getItem('var_' + inter[0] + "_" + referencia) == inter[1])
						{
							resultat+=inter[2];
						}
					}
					else 
					{
						if (inter.length==4)
						{
							if (localStorage.getItem('var_' + inter[0] + "_" + referencia) == inter[1])
							{
								resultat+=inter[2];
							}
							else
							{
								resultat+=inter[3];
							}
						}
					}
				}
			}
			texte = resultat;
			return texte;
		}

	function reordenaCuestionario () {
		if(randomConfig){
			let grupo = randomConfig.parentNode.parentNode.parentNode.parentNode.parentNode;
			grupo.style.display = 'none';
			if (grupo.getAttribute("class").slice(0,38)=="genially-view-item genially-view-group")
			{
				ordenAleatorio = (getSibling(randomConfig.id).innerHTML.indexOf('true') != -1);
				if(ordenAleatorio){
					cuestionario = permutaSinRepe(cuestionario);
				}
				var huecos = Math.max(Math.ceil(numPreguntas / numRequeridas), 1);
				var preguntasRequeridas = [];
				for(var i = 0; i < cuestionario.length; i++){
					if(cuestionario[i].requerida){
						preguntasRequeridas.push(cuestionario.splice(i,1)[0]);
					}
				}
				for(var i = 0, j = 0; j < preguntasRequeridas.length; i += huecos, j++){
					cuestionario.splice(i, 0, preguntasRequeridas[j]);
				}
								
				console.log("ordenAleatorio " + ordenAleatorio);
			}
		}
	}

      if (!overflow) i++;

      elem.style.top = ((parent.clientHeight - elem.clientHeight) / 3) + "px";
      elem.style.position = "relative";
    }
  }
  
  // Revert visibility and display to their original state
  parent.style.visibility = "visible";
  parent.style.display = prevDisplay;

						if(thisScoreObject[att.toLowerCase()][id] != null){
							texto.innerHTML = texto.innerHTML.replace(tags[i], thisScoreObject[att.toLowerCase()][id]);
						} else {
							texto.innerHTML = texto.innerHTML.replace(tags[i], "-");
						}

						texto.innerHTML = texto.innerHTML.replace(tags[i], "-");
					}
				} else {
					texto.innerHTML = texto.innerHTML.replace(tags[i], "-");
				}
			}
		}
		
	}

						var matchTemp;
						for(var j = 0; j < matchesAux.length; j++){
							matchTemp = matchesAux[j].replace(/^eval\{/g, "");

							if(!/(\$(v|q)|\,)/.test(matchTemp)){

							} else if(/\,/.test(matchTemp)){
								matches[i] = matchTemp/*.replace(/\./g, ",")*/;

							}
						}
						
					}
					
					if(!/\$q/.test(matches[i]) && !/\,/.test(resultado)){
						resultado = eval(matches[i]);
					
						resultado = (resultado == 0 || (!isNaN(resultado) && resultado != "undefined") ? resultado.toString() : "");
						while(resultado.includes(".") && (resultado.charAt(resultado.length-1) == "0")){

						}
						
						if(resultado.charAt(resultado.length-1) == "."){

						}

									redondeo = redondeo + "|" + round(parseFloat(resultado), j);
									redondeo = redondeo + (!redondeo.includes("|" + dec[0] + "." + dec[1].substring(0, j) + "|") ? "|" + dec[0] + "." + dec[1].substring(0, j) : '');
								}
								resultado = redondeo;
								dec[1] = dec[1].substring(0,2);
								resultado = resultado + "|" + dec[0] + "." + dec[1]
							}
							for(var m = 0; dec[1] && m < dec[1].length; m++){
								if(dec[1].charAt(dec[1].length - m - 1) == '0'){
									resultado = resultado + "|" + dec[0] + "." + dec[1].substring(0, dec[1].length - m - 1);

							}

							if(/\./g.test(resultado)){
								resultado = resultado + "|" + resultado.replace(/\./g, ",");
							}
						} else {
							var decimalPos = Math.min(resultado.split(".")[1] || 0, 3);
							
							resultado = parseFloat(resultado).toFixed(decimalPos).toString().replace(".", ",");
							
							while(resultado.includes(",") && (resultado.charAt(resultado.length-1) == "0")){
								resultado = resultado.slice(0, -1)
							}
							
							if(resultado.charAt(resultado.length-1) == ","){
								resultado = resultado.slice(0, -1)
							}
							
						} 
						texto = texto.replace(beforeEval, resultado.toString());
					} else if (/\,/.test(resultado)){
						texto = texto.replace(beforeEval, resultado.toString() + "|" + resultado.toString().replace(/\,/g, ", "));
					}
					
				}
			}
			
		if(input) {
			texto = texto.replace(/\<[^\<]*\>/g, "");
			var simplificar = texto.match(/((\+|\-)?(\(.+\)|\d+)\*0)|((\+|\-)?0\/(\(.+\)|\d+))|(^0\+)/g) || [];
			var textoAlt = texto;
			for(var m = 0; m < simplificar.length; m++){
				textoAlt = textoAlt.replace(simplificar[m], "");
			}
			texto = (simplificar.length > 0 ? texto + "|" + textoAlt : texto);
		}
		return texto.split("|");
	}

					horas = timers[timers.length-3] || 0;

				}
				
				objPregunta.respCorrecta = parseSolution(pregunta.respCorrecta, objPregunta.respFalsas.length == 0, n);
		
				cuestionario.splice(i, 0, objPregunta);
				
			}
			i = i + multi - 1;
		}
		scoreTarget = scoreTarget || cuestionario.length;
	}

	function randomNumber(min,max){
		var rnd = parseInt(Math.random() * max - min);
		return rnd;
	}
	
	
	function randomValue(min,max){
		var decimalPos = Math.max(min.countDecimals(), max.countDecimals());
		// If both the minimum and maximum values are integers, return a random integer. Don't let the user specify any decimal places.
		if (decimalPos == 0) {
			
			return Math.floor(Math.random() * (parseInt(max) - parseInt(min) + 1)) + parseInt(min);
		}

		// Otherwise, return a random floating point number with specified decimal places.
		else {

			// Make sure the minimum value is a number.
			if (Number.isNaN(Number.parseFloat(min))) {
				new Error("El valor mínimo no es un número.");
			}

			// Make sure the maximum value is a number.
			if (Number.isNaN(Number.parseFloat(max))) {
				new Error("El valor máximo no es un número.");
			}
			
			 // Generate the floating point number.
			let value = (Math.random() * (parseFloat(max) - parseFloat(min))) + parseFloat(min);
			var decimalPosShow = (decimalPos == 1 ? decimalPos + 1 : decimalPos)
			return Number(parseFloat(value).toFixed(decimalPos)).toFixed(decimalPosShow);

		}
	}
	
	function maximoComunDivisor(arr) {
        let result = parseInt(arr[0]);
        for (let i = 1; i < arr.length; i++) {
            result = maximoComunDivisorPar(parseInt(arr[i]), parseInt(result));
  
            if (result == 1) {
                return 1;
            }
        }
        return result;
    }
	
	function maximoComunDivisorPar (a, b) {
		//Devuelve el MCD de a y b
		let temporal; //Para no perder b
		while (b !== 0) {
			temporal = b;
			b = a % b;
			a = temporal;
		}
		return a;
	}

	function minimoComunMultiplo(arr) {
        let result = parseInt(arr[0]);
        for (let i = 1; i < arr.length; i++) {
            result = minimoComunMultiploPar(parseInt(arr[i]), parseInt(result));
  
            if (result == 1) {
                return 1;
            }
        }
        return result;
    }

	function sortArr(arr) {
        
        arr.sort(function(a, b){return a-b});
        return arr.toString();
    }

	function reverseArr(arr) {
        
        arr.sort(function(a, b){return b-a});
        return arr.toString();
    }
	
	function minimoComunMultiploPar (a, b) {
		//Devuelve el mcm de a y b
		return (a * b) / maximoComunDivisorPar(a, b);
	}
	
	function par (a, b) {
		//Devuelve un número par entre a y b
		var pares = [];
		for(var i = a; i <= b; i++){
			
			if(i % 2 === 0){
			  pares.push(parseInt(i));			  
			}
		}
		return pares[randomValue(0,pares.length-1)];
	}
	
	function impar (a, b) {
		//Devuelve un número impar entre a y b
		var impares = [];
		for(var i = a; i <= b; i++){
			
			if(i % 2 === 1){
			  impares.push(parseInt(i));			  
			} 
		}
		return impares[randomValue(0,impares.length-1)];
	}
	
	
	function getPrime (a, b) {
		//Devuelve un número primo entre a y b
		var primos = [];
		var esPrimo;
		for(var i = a; i <= b; i++){
			if (i == 0 || i == 1 || i == 4) {
				esPrimo = false;
			} else {
				esPrimo = true;
				
				for(var j = 2; j < i/2 && esPrimo; j++){
				
						if (i % j == 0) esPrimo = false;
					
					// Si no se pudo dividir por ninguno de los de arriba, sí es primo
					
				}
			}
			if(esPrimo) primos.push(i);
		}
		return primos[randomValue(0,primos.length-1)];
	}
	
	function pow (a, b, c) {
		//Devuelve una potencia de a entre b y c
		var potencias = [];
		var exit = false;
		for(var i = 0; !exit; i++){
			var pot = Math.pow(a, i)
			if(pot >= b && pot <= c){
			  potencias.push(parseInt(pot));			  
			} else if (pot > c){
				exit = true;
			}
		}
		return potencias[randomValue(0,potencias.length-1)];
	}
	
	function multiplo (a, b, c) {
		//Devuelve un múltiplo del número a entre b y c
		var multiplos = [];
		var exit = false;
		for(var i = 0; !exit; i++){
			var mult = a * i;
			if(mult >= b && mult <= c){
			  multiplos.push(parseInt(mult));			  
			} else if (mult > c){
				exit = true;
			}
		}
		return multiplos[randomValue(0,multiplos.length-1)];
	}	
		
	function divisor (a, b, c) {
		//Devuelve un múltiplo del número a entre b y c
		var divisores = [];
		for(var i = parseInt(b); i < parseInt(c); i++){

			if(parseInt(a) % i === 0){
			  divisores.push(parseInt(i));
			}
		}
		return divisores[randomValue(0,divisores.length-1)];
	}	
	
	function divisores (a) {
		//Devuelve un múltiplo del número a entre b y c
		var divisores = [];
		for(var i = 0; i <= a; i++){

			if(parseInt(a) % i === 0){
			  divisores.push(parseInt(i));
			}
		}
		return divisores.toString();
	}

	function parseFunctions (valorVar){
		
		var matches = valorVar.match(/eval\{[^}]+\}/g) || [];
		for(var l = 0; l < matches.length; l++){
			valorVar = valorVar.replace(matches[l], eval(matches[l].substring(5).replace("}", "")) || matches[l]);
		}
		
		var mcd = valorVar.match(/mcd\(\d+\,\d+(\,\d+)*\)/) || [];
		var mcm = valorVar.match(/mcm\(\d+\,\d+(\,\d+)*\)/) || [];
		var parF = valorVar.match(/^par\(\d+\,\d+\)/) || [];
		var prim = valorVar.match(/pri\(\d+\,\d+\)/) || [];
		var imparF = valorVar.match(/imp\(\d+\,\d+\)/) || [];
		var pow = valorVar.match(/pow\((\d+|\d+\.\d+)\,(\d+|\d+\.\d+),(\d+|\d+\.\d+)\)/) || [];
		var mult = valorVar.match(/mult\(\d+\,\d+\,\d+\)/) || [];
		var div = valorVar.match(/div\(\d+\,\d+,\d+\)/) || [];
		var divs = valorVar.match(/divs\(\d+\)/) || [];
		var math = valorVar.match(/Math.+\(.+\)/) || [];
		var sort = valorVar.match(/sort\((\d+|\d+\.\d+)\,(\d+|\d+\.\d+)(\,(\d+|\d+\.\d+))*\)/) || [];
		var rev = valorVar.match(/rev\((\d+|\d+\.\d+)\,(\d+|\d+\.\d+)(\,(\d+|\d+\.\d+))*\)/) || [];
				
		for(var l = 0; l < mcd.length; l++){
			if(mcd[l] && /mcd/.test(mcd[l])){
				var valores = mcd[l].match(/\d+/g);
				
				// var num2 = parseInt(mcd[l].substring(4).split(',')[1].trim());
				valorVar = valorVar.replace(mcd[l], maximoComunDivisor(valores));
			}
		}
		for(var l = 0; l < mcm.length; l++){
			if(mcm[l] && /mcm/.test(mcm[l])){
				var valores = mcm[l].match(/(\d+|\d+\.\d+)/g);
				// var num1 = parseInt(mcm[l].substring(4).split(',')[0].trim());
				// var num2 = parseInt(mcm[l].substring(4).split(',')[1].trim());
				valorVar = valorVar.replace(mcm[l], minimoComunMultiplo(valores));
			}
		}
		for(var l = 0; l < parF.length; l++){
			var num1 = parseInt(parF[l].substring(4).split(',')[0].trim());
			var num2 = parseInt(parF[l].substring(4).split(',')[1].trim());
			valorVar = valorVar.replace(parF[l], par(num1,num2));
		}
		for(var l = 0; l < prim.length; l++){
			var num1 = parseInt(prim[l].substring(4).split(',')[0].trim());
			var num2 = parseInt(prim[l].substring(4).split(',')[1].trim());
			valorVar = valorVar.replace(prim[l], getPrime(num1,num2));
		}
		for(var l = 0; l < imparF.length; l++){
			var num1 = parseInt(imparF[l].substring(4).split(',')[0].trim());
			var num2 = parseInt(imparF[l].substring(4).split(',')[1].trim());
			valorVar = valorVar.replace(imparF[l], impar(num1,num2));
		}
		for(var l = 0; l < pow.length; l++){
			var base = parseInt(pow[l].substring(4).split(',')[0].trim());
			var min = parseInt(pow[l].substring(4).split(',')[1].trim());
			var max = parseInt(pow[l].substring(4).split(',')[2].trim());
			valorVar = valorVar.replace(pow[l], pow(base,min, max));
		}
		for(var l = 0; l < mult.length; l++){
			var num = parseInt(mult[l].substring(5).split(',')[0].trim());
			var min = parseInt(mult[l].substring(5).split(',')[1].trim());
			var max = parseInt(mult[l].substring(5).split(',')[2].trim());
			valorVar = valorVar.replace(mult[l], multiplo(num,min, max));
		}
		for(var l = 0; l < div.length; l++){
			var num = parseInt(div[l].substring(4).split(',')[0].trim());
			var min = parseInt(div[l].substring(4).split(',')[1].trim());
			var max = parseInt(div[l].substring(4).split(',')[2].trim());
			valorVar = valorVar.replace(div[l], divisor(num,min, max));
		}
		for(var l = 0; l < divs.length; l++){
			var num = parseInt(divs[l].match(/(\d+|\d+\.\d+)/)[0].trim());			
			valorVar = valorVar.replace(divs[l], divisores(num));
		}
		for(var l = 0; l < math.length; l++){
			
			valorVar = valorVar.replace(math[l], eval(math[l]));
			
		}
		for(var l = 0; l < sort.length; l++){
			if(sort[l] && /sort/.test(sort[l])){
				var vals = sort[l].match(/\(.+\)/)[0].replace(/\(|\)/g, "").split(",");
				
				valorVar = valorVar.replace(sort[l], sortArr(vals));
			}
		}
		for(var l = 0; l < rev.length; l++){
			if(rev[l] && /rev/.test(rev[l])){
				var vals = rev[l].match(/\(.+\)/)[0].replace(/\(|\)/g, "").split(",");
				
				valorVar = valorVar.replace(rev[l], reverseArr(vals));
			}
		}
		return valorVar;
	}

    // This will parse a delimited string into an array of
    // arrays. The default delimiter is the comma, but this
    // can be overriden in the second argument.
    function CSVToArray( strData, strDelimiter ){
        // Check to see if the delimiter is defined. If not,
        // then default to comma.
        strDelimiter = (strDelimiter || ",");

        // Create a regular expression to parse the CSV values.
        var objPattern = new RegExp(
            (
                // Delimiters.
                "(\\" + strDelimiter + "|\\\\|\\r?\\n|\\r|^)" +

                // Quoted fields.
                "(?:\"([^\"]*(?:\"\"[^\"]*)*)\"|" +

                // Standard fields.
                "([^\"\\" + strDelimiter + "\\r\\n\\\\]*))"
            ),
            "gi"
            );


        // Create an array to hold our data. Give the array
        // a default empty first row.
        var arrData = [[]];

        // Create an array to hold our individual pattern
        // matching groups.
        var arrMatches = null;


        // Keep looping over the regular expression matches
        // until we can no longer find a match.
        while (arrMatches = objPattern.exec( strData )){

            // Get the delimiter that was found.
            var strMatchedDelimiter = arrMatches[ 1 ];

            // Check to see if the given delimiter has a length
            // (is not the start of string) and if it matches
            // field delimiter. If id does not, then we know
            // that this delimiter is a row delimiter.
            if (
                strMatchedDelimiter.length &&
                strMatchedDelimiter !== strDelimiter
                ){

                // Since we have reached a new row of data,
                // add an empty row to our data array.
                arrData.push( [] );

            }

            var strMatchedValue;

            // Now that we have our delimiter out of the way,
            // let's check to see which kind of value we
            // captured (quoted or unquoted).
            if (arrMatches[ 2 ]){

                // We found a quoted value. When we capture
                // this value, unescape any double quotes.
                strMatchedValue = arrMatches[ 2 ].replace(
                    new RegExp( "\"\"", "g" ),
                    "\""
                    );

            } else {

                // We found a non-quoted value.
                strMatchedValue = arrMatches[ 3 ];

            }


            // Now that we have our value string, let's add
            // it to the data array.
            arrData[ arrData.length - 1 ].push( strMatchedValue );
        }

        // Return the parsed data.
        return( arrData );
    }

	function permutaSinRepe(a_reordenar){
		
		var array = a_reordenar;
		var currentIndex = array.length, temporaryValue, randomIndex;
		
		while (0 !== currentIndex) {
		// Pick a remaining element...
		randomIndex = Math.floor(Math.random() * currentIndex);
		currentIndex -= 1;
		

		// And swap it with the current element.
		temporaryValue = array[currentIndex];
		array[currentIndex] = array[randomIndex];
		
		array[randomIndex] = temporaryValue;
	  }

	  return array;
	}

	function saveFeedback (victory) {
		
		var currentScoreObjTxt = localStorage.getItem('feedbackRetos' + referencia);
		var index = -1;

		var thisScoreObject = {
				refPage : refpage, //ref de página
				tag : quizTag || refpage, //etiqueta
				df : new Date().today(), //fecha último intento
				tf : new Date().timeNow(), //hora último intento
				te : new Date(new Date().getTime() - startTime.getTime()).timeNowUTC(), //Tiempo empleado
				sp : marcadores.scorePoints, //puntos conseguidos
				bs : marcadores.bestScorePoints, //mejor puntuación
				bh : marcadores.bestScoreHits, //mejor número aciertos
				ws : Math.max(...marcadores.scorePoints), //Puntos del ganador
				wh : Math.max(...marcadores.scoreHits), //Puntos del ganador
				rs : [], // Records: puntos
				rp : [], // Records: nombre jugador
				rh : [], // Records: número de aciertos
				wp : marcadores.playerNames[marcadores.scorePoints.indexOf(Math.max(...marcadores.scorePoints))], //Puntos del ganador
				sh : marcadores.scoreHits, //preg Acertadas
				e : marcadores.scoreErrors, //errores
				p : marcadores.playerNames, // playerNames
				w: (victory ? '1' : '0'), //wins
				t : '1' //tries
			};
			thisScoreObject.rs.push(thisScoreObject.ws);
			thisScoreObject.rp.push(thisScoreObject.wp);
			thisScoreObject.rh.push(thisScoreObject.wh);
		if(currentScoreObjTxt && currentScoreObjTxt != "" && currentScoreObjTxt != "undefined"){
			
			var currentScoreObj = JSON.parse(currentScoreObjTxt);
			
			index = currentScoreObj.map(object => object.tag).indexOf(thisScoreObject.tag);
			
			if(index != -1){				
				thisScoreObject.tries = parseInt(currentScoreObj[index].t) + 1;
				thisScoreObject.wins = parseInt(thisScoreObject.w) + (victory ? 1 : 0);
				for(var i = 0; i < currentScoreObj[index].sp.length; i++){
					thisScoreObject.bh[i] = Math.max(thisScoreObject.bh[i], thisScoreObject.sh[i], parseInt(currentScoreObj[index].bh[i]));
					thisScoreObject.bs[i] = Math.max(thisScoreObject.bs[i], thisScoreObject.sp[i], parseInt(currentScoreObj[index].bs[i]));
				}
				var records = new Map();
				currentScoreObj[index].rs = (Array.isArray(currentScoreObj[index].rs) ? currentScoreObj[index].rs : []);
				currentScoreObj[index].rp = (Array.isArray(currentScoreObj[index].rp) ? currentScoreObj[index].rp : []);
				currentScoreObj[index].rh = (Array.isArray(currentScoreObj[index].rh) ? currentScoreObj[index].rh : []);
				currentScoreObj[index].rs.push(thisScoreObject.rs[0]);
				currentScoreObj[index].rp.push(thisScoreObject.rp[0]);
				currentScoreObj[index].rh.push(thisScoreObject.rh[0]);
				for(var i = 0; i < currentScoreObj[index].rs.length; i++){
					records.set(currentScoreObj[index].rs[i], [currentScoreObj[index].rp[i], currentScoreObj[index].rh[i]]);					
				}
				const mapSort = new Map([...records.entries()].sort((a, b) => b[0] - a[0]));
				thisScoreObject.rp = [];
				thisScoreObject.rh = [];
				thisScoreObject.rs = [...mapSort.keys()];
				for(var i = 0; i < [...mapSort.values()].length; i++){
					thisScoreObject.rp.push([...mapSort.values()][i][0]);
					thisScoreObject.rh.push([...mapSort.values()][i][1]);
				}
				
				currentScoreObj.splice(index, 1);
			}
		} else {
			var currentScoreObj = [];			
		}
		
		currentScoreObj.push(thisScoreObject);
		localStorage.setItem('feedbackRetos' + referencia, JSON.stringify(currentScoreObj));
	}
	
	function getRandomFeedback(texto) {
		var split = texto.split("|");
		var selFbk;
		if(split.length > 0){
			selFbk = split[randomNumber(0, texto.split("|").length)].trim();
		} else {
			selFbk = texto;
		}
		return selFbk;
	}

		var rnd = randomNumber(0,100);
		
		clearInterval(chronoLimitQuestion);

	function validarRespuestaTxt(){
		if(!bloqueo){

				bloqueo = true;
				for (var x = 0; x < cuestionario[preguntaActual].respCorrecta.length; x++)

					if(!/\$q/.test(cuestionario[preguntaActual].respCorrecta[x])){
						if (respuestaTxt.toUpperCase() === cuestionario[preguntaActual].respCorrecta[x].trim().toUpperCase().replace("\n", "")){correspondencia = true;}
					} else {
						
						var respOrig = cuestionario[preguntaActual].respCorrecta[x];
						while(/eval\{/.test(respOrig) && !correspondencia){
							var matchesAux = respOrig.match(/eval\{[^{}]+\}/g) || []
							var matchTemp;
							for(var j = 0; j < matchesAux.length; j++){
								matchTemp = matchesAux[j].replace(/^eval\{/g, "");
								matchTemp = matchTemp.replace(/\}$/g, "");
								matchTemp = parseFunctions (matchTemp);
								// matchTemp = matchTemp.replace(/\,/g, ".");
								matchTemp = matchTemp.replace(/\$q/g, respuestaTxt);
								
								respOrig = respOrig.replace(matchesAux[j], eval(matchTemp));
								
							}
							
							if (!/false/.test(respOrig)){correspondencia = true;}
						}
						
					}
					
				}

			var timers = textoAdj.innerText.match(/(\d\d?:)?\d\d?:\d\d?/)[0].split(":");
			segundos = timers[timers.length-1] || 0;
			minutos = timers[timers.length-2] || 0;
			horas = timers[timers.length-3] || 0;
		}
		
		if(fin){

		}
		
	}
		
	function chrono(){
				
		var inicia = sessionStorage.getItem('iniciaCrono');
		var fin =  sessionStorage.getItem('finalizaCrono');
		var horaAct = new Date().getTime();
		
		if (finishTemp) {

		}

		} else {

		}
		if (!finishTemp) {
			var chrono = dateHMS(diferencia);
			crono.innerHTML = chrono;
		}
		
	}
	
	function dateHMS(time) 
	{
	  var addZero = function(v) { return v < 10 ? '0' + v : v; };
	  var d = new Date(time); 
	  var t = [];
	  if(addZero(d.getUTCHours()) != '00') {t.push(addZero(d.getUTCHours()));}
	  t.push(addZero(d.getMinutes()))
	  
	  t.push(addZero(d.getSeconds()));
	  return t.join(':');
	}
	
	function inicializaCrono(){
		// console.log('Se inicia el crono');
		var minutos;
		var segundos;
		var horas;
		if(timerSet){
			var timers = timerSet.split(":");
			segundos = parseInt(timers[timers.length-1]) || 0;
			minutos = parseInt(timers[timers.length-2]) || 0;
			horas = parseInt(timers[timers.length-3]) || 0;
		}
		finishTemp = false;
		if((minutos + horas + segundos) > 0){
			timerMode = "timer";
			var inicio = new Date();
			var fin = new Date(inicio.getTime() + (segundos*1000) + (minutos * 60000) + (horas * 3600000));
			inicio = inicio.getTime();
			sessionStorage.setItem('iniciaCrono',inicio);
			sessionStorage.setItem('finalizaCrono',fin.getTime());
			
			var chrono = dateHMS(0);
			crono.innerHTML = chrono;
		} else {
			var inicio = new Date();
			timerMode = "crono";
			inicio = inicio.getTime();
			sessionStorage.setItem('iniciaCrono',inicio);
			sessionStorage.removeItem('finalizaCrono');
			
			var chrono = dateHMS(0);
			crono.innerHTML = chrono;
		}
	}

			getScore(n) {
				return parseInt(this.scorePoints[n]) || 0;
			},

			animateScore(targetScore, scoreObject, n) {
				var actScore = parseInt(scoreObject.innerText);
				var diff = parseInt(targetScore - actScore);
				diff = (diff > 0 ? diff : Math.abs(diff));
				var paso = Math.floor(Math.max(diff / 20, 1));
				if (actScore < targetScore) {

					actScore = (actScore + paso <= targetScore ? actScore + paso : targetScore);
					scoreObject.innerText = actScore;
				}

				if (actScore >= targetScore) {

					scoreObject.innerText = targetScore;
					clearInterval(intervalUpdate[n]);
				} else { }

			},

			slideScore(scoreObject, targetScore, n) {
				var actScore = parseInt(scoreObject.innerText);
				if (parseInt(targetScore - actScore) > 0) {
					//clonamos el marcador para mostrar los puntos ganados y animarlo
					var scoreClone = scoreObject.closest('div.genially-animated-wrapper').cloneNode(true);
					scoreObject.closest('div.genially-animated-wrapper').parentNode.appendChild(scoreClone);
					var txtScoreClone = scoreClone.querySelector(".scoreTxt");
					txtScoreClone.innerText = "+" + parseInt(targetScore - actScore);
					//Buscamos todos los elementos del grupo que no queremos animar y los ocultamos
					var locateNode = scoreClone;
					while (locateNode.childNodes.length == 1) {
						locateNode = locateNode.firstChild;
					}
					var hiddenSiblings = locateNode.childNodes;
					for (var k = 0; k < hiddenSiblings.length; k++) {
						if (!hiddenSiblings[k].querySelector(".scoreTxt")) {
							hiddenSiblings[k].style.visibility = "hidden";
						}
					}

					scoreClone.firstChild.classList.add("scoreAnimation");
					var prevInterval = intervalUpdate[n];
					intervalUpdate[n] = setInterval(this.animateScore, 20, targetScore, scoreObject, n);
					if (intervalUpdate[n] != prevInterval) {
						clearInterval(prevInterval);
					}
					setTimeout(function () {
						var clones = document.querySelectorAll(".scoreAnimation");
						for (var i = 0; i < clones.length; i++) {
							clones[i].parentNode.remove();
						}

						clearInterval(intervalUpdate[n]);
						scoreObject.innerText = targetScore;
					}, 2000);
				}
			},

			updateScores() {
				for (var i = 0; i < numJugadores; i++) {

					if (this.scores[i] && parseInt(this.scores[i].innerText) != parseInt(this.getScore(i))) {

						var targetScore = parseInt(this.getScore(i));
						var scoreObject = this.scores[i];
						this.slideScore(scoreObject, targetScore, 0);
					}

					if (this.hits[i] && parseInt(this.hits[i].innerText) != parseInt(this.getScore(i))) {

						var targetScore = parseInt(this.scoreHits[i]);
						var scoreObject = this.hits[i];
						this.slideScore(scoreObject, targetScore, 1);
					}
				}
			},

			preloadScores() {

				var textos = page.querySelectorAll(".genially-view-text, div[data-cy=text-item], div[data-cy=textItemView]");
				for (var e = 0; e < textos.length; e++) {
					if (/\$SCORE\d+/.test(textos[e].innerText)) {
						var scoreIndex = Math.abs(parseInt(textos[e].innerText.match(/\d+/))) || 1;
						this.scores[scoreIndex - 1] = obtenTextoHijo(textos[e].parentNode);
						this.scores[scoreIndex - 1].setAttribute("class", "scoreTxt");
					}

					if (/\$HITS\d+/.test(textos[e].innerText)) {
						var scoreIndex = Math.abs(parseInt(textos[e].innerText.match(/\d+/))) || 1;
						this.hits[scoreIndex - 1] = obtenTextoHijo(textos[e].parentNode);
						this.hits[scoreIndex - 1].setAttribute("class", "scoreTxt");
					}

					if (/\$T\d+/.test(textos[e].innerText)) {
						var scoreIndex = Math.abs(parseInt(textos[e].innerText.match(/\d+/))) || 1;
						this.cronosUsuarios[scoreIndex - 1] = obtenTextoHijo(textos[e].parentNode);
						this.cronosUsuarios[scoreIndex - 1].setAttribute("class", "timerUserTxt");
					}
				}
				numJugadores = Math.max(this.scores.length, this.hits.length, 1);
				this.resetScores();
				this.changePlayer();
			},

			hitScore(n) {
				this.scoreRally[n]++;
				this.scoreHits[n]++;
				var timeElapsed = new Date().getTime() - questionTimer.getTime();
				var timeBonus = Math.max(0, (60000 - timeElapsed) / 1000) * 0.01;
				var actMultiplier = this.scoreMultiplier[n] + Math.floor(this.scoreRally[n] / 5) * .5 + (this.scoreHits[n] * .2) + timeBonus;
				this.scoreMultiplier[n] += Math.floor((this.scoreRally[n] / 5 * .5) + (this.scoreHits[n] * .2));
				this.scorePoints[n] = Math.ceil(this.scorePoints[n] + actMultiplier * 100 + 100);

				this.updateScores();
			},

			resetRally(n) {
				this.scoreRally[n] = 0;

				this.changePlayer();
			},

			getParamNumber(node, defaultVal, tag) {
				var textos = node.querySelectorAll(".genially-view-text, div[data-cy=text-item], div[data-cy=textItemView]");
				var param = defaultVal;
				var lastDiv;
				for (var e = 0; e < textos.length; e++) {
					if (/\d+/.test(textos[e].innerText)) {
						param = parseInt(textos[e].innerText.match(/\d+/));
						lastDiv = textos[e];
						while (lastDiv.lastChild) {
							lastDiv = lastDiv.lastChild;
						}
						lastDiv = lastDiv.parentNode;
						lastDiv.setAttribute("class", tag);


					}
				}
				if (lastDiv && param == Number.MAX_VALUE) { lastDiv.style.display = "none"; }
				return [param, lastDiv];
			},

			resetScores() {
				for (var scoreIndex = 0; scoreIndex < numJugadores; scoreIndex++) {
					this.scorePoints[scoreIndex] = 0;
					if (this.scores[scoreIndex]) { this.scores[scoreIndex].innerText = this.scorePoints[scoreIndex]; }
					this.scoreMultiplier[scoreIndex] = 1;
					this.scoreRally[scoreIndex] = 0;
					this.scoreHits[scoreIndex] = 0;
					this.bestScorePoints[scoreIndex] = this.bestScorePoints[scoreIndex] || 0;
					this.bestScoreHits[scoreIndex] = this.bestScoreHits[scoreIndex] || 0;
					this.scoreErrors[scoreIndex] = 0;
					if (this.hits[scoreIndex]) { this.hits[scoreIndex].innerText = this.scoreHits[scoreIndex]; }
					if (this.cronosUsuarios[scoreIndex]) { this.cronosUsuarios[scoreIndex].innerText = 0; this.cronosUsuarios[scoreIndex].style.display = "none" }
					var nextButtonParam;
					var btn50Param;
					var btnTlfParam;
					if (btnNext) {
						nextButtonParam = btnNextInit || this.getParamNumber(btnNext, Number.MAX_VALUE, "nextParam");
						btnNextInit = nextButtonParam;
						btnNextScore = btnNext.closest('div.genially-animated-wrapper').querySelector(".nextParam");
					}
					if (btn50) {
						btn50Param = btn50Init || this.getParamNumber(btn50, 1, "btn50Param");
						btn50Init = btn50Param;
						btn50Score = btn50.closest('div.genially-animated-wrapper').querySelector(".btn50Param");
					}
					if (btnTlf) {
						btnTlfParam = btnTlfInit || this.getParamNumber(btnTlf, 1, "btnTlfParam");
						btnTlfInit = btnTlfParam;
						btnTlfScore = btnTlf.closest('div.genially-animated-wrapper').querySelector(".btnTlfParam");
					}
					this.powerUps[scoreIndex] = [(btnTlfParam ? btnTlfParam[0] : 0), (btn50Param ? btn50Param[0] : 0), (nextButtonParam ? nextButtonParam[0] : 0)]; //false significa usado. (btn1, btn2)	
					jugadorActual = -1;
					this.changePlayer();
				}
			},

			hasNextPower(n) {
				return this.powerUps[n][2] > 0;
			},

			changePlayer() {
				jugadorActual++;
				if (respuestaInput) {
					bloqueo = false;
					respuestaInput.value = "";
					respuestaInput.focus();
				}
				if (jugadorActual >= numJugadores) { jugadorActual = 0 }

					if (jugadorActual == scoreIndex) { this.scores[scoreIndex].closest('div.genially-animated-wrapper').style.opacity = "1"; }
					else { this.scores[scoreIndex].closest('div.genially-animated-wrapper').style.opacity = ".5"; }

		function transform(texte) {

			var decoupe = texte.split("§");
			var resultat = "";
			for (var i = 0; i < decoupe.length; i++) {
				if (i % 2 == 0) {
					resultat += decoupe[i];
				}
				else {
					var inter = decoupe[i].split("|");
					if (inter.length == 1) {
						resultat += localStorage.getItem('var_' + inter[0] + "_" + referencia);
					}
					else if (inter.length == 3) {
						if (localStorage.getItem('var_' + inter[0] + "_" + referencia) == inter[1]) {
							resultat += inter[2];
						}
					}
					else {
						if (inter.length == 4) {
							if (localStorage.getItem('var_' + inter[0] + "_" + referencia) == inter[1]) {
								resultat += inter[2];
							}
							else {
								resultat += inter[3];
							}
						}
					}
				}
			}
			texte = resultat;
			return texte;
		}

	function resizeText(elem) {
		// Initialize customFontSize variable
		let customFontSize = null;

		// Locate the customFontSize element
		const customFontSizeElement = document.getElementById('customFontSize');

		// Debugging: Verify we have the right starting element
		console.log("customFontSizeElement:", customFontSizeElement);

		// Navigate two parent nodes up from customFontSizeElement
		let grandParentElement = customFontSizeElement.parentNode.parentNode.parentNode;

		// Debugging: Verify grandParentElement
		console.log("grandParentElement:", grandParentElement);

		// Locate the sibling element using nextElementSibling
		let siblingElement = grandParentElement.nextElementSibling;

		// If siblingElement is null, try previousElementSibling
		if (!siblingElement) {
			siblingElement = grandParentElement.previousElementSibling;
		}

		// Debugging: Verify siblingElement
		console.log("siblingElement:", siblingElement);

		// Navigate two child nodes down from siblingElement
		const textElement = siblingElement ? siblingElement.children[0].children[0] : null;

		// Debugging: Verify textElement
		console.log("textElement:", textElement);

		if (textElement) {
			customFontSize = parseInt(textElement.innerText.trim(), 10);

			// Debugging: Show the fetched size
			console.log("Fetched Font Size:", customFontSize);
		}


		// Existing logic for creating or selecting the element
		if (!elem.parentNode.getAttribute("data-createdElem")) {
			var newEl = document.createElement("div");
			newEl.setAttribute("data-createdElem", true);
			elem.parentNode.appendChild(newEl);
			newEl.appendChild(elem);
			elem = newEl;
		} else {
			elem = elem.parentNode;
		}

		// Existing logic for finding the parent
		var parent = elem.closest('div.genially-animated-wrapper');
		if (parent.querySelector('div[data-type=answer_checked]')) {
			parent = parent.querySelector('div[data-type=answer_checked]').parentNode.parentNode;
		}

		// Existing logic for traversing child and parent nodes
		while (elem.nodeName == "SPAN" && !elem.id) {
			elem = elem.parentNode;
		}
		while (elem.firstChild && elem.id && !elem.getAttribute("data-baseText")) {
			elem = elem.firstChild;
		}

		// Mark the base text
		elem.setAttribute("data-baseText", true);

		// Prepare for size calculation
		var prevDisplay = parent.style.display;
		parent.style.visibility = "hidden";
		parent.style.display = "block";

		// Custom Font Size logic starts here
		if (customFontSize !== null) {
			elem.style.fontSize = customFontSize + "px"; // Set the custom font size
		} else {
			// Original dynamic resizing logic
			var sinGrupo = elem.parentNode.clientHeight == parseInt(parent.style.height);
			let i = 12;
			let overflow = false;
			const maxSize = 120;
			while (!sinGrupo && !overflow && i < maxSize) {
				elem.style.fontSize = i + "px";
				overflow = isOverflown(elem, parent);
				if (!overflow) i++;
			}
			if (!sinGrupo) {
				elem.style.fontSize = (i - 2) + "px";
				elem.style.top = ((parent.clientHeight - elem.clientHeight) / 3) + "px";
				elem.style.position = "relative";
			}
		}

		// Revert visibility and display to their original state
		parent.style.visibility = "visible";
		parent.style.display = prevDisplay;

	}


	function parseGamesRecords(texto, ref) {

		var currentSoreObjTxt = localStorage.getItem('feedbackRetos' + referencia);

		if (currentSoreObjTxt && currentSoreObjTxt != "" && currentSoreObjTxt != "undefined" && /\w+\:/.test(texto.innerHTML)) {

			var currentSoreObj = JSON.parse(currentSoreObjTxt);
			var tags = texto.innerHTML.match(/\$\w+\s*\:\s*\w+/g) || [];
			for (var i = 0; i < tags.length; i++) {
				var split = tags[i].split(":");

						}

							resultado = resultado + "|" + resultado.replace(/\./g, ",");
						}
					} else {
						var decimalPos = Math.min(resultado.split(".")[1] || 0, 3);

						resultado = parseFloat(resultado).toFixed(decimalPos).toString().replace(".", ",");

						while (resultado.includes(",") && (resultado.charAt(resultado.length - 1) == "0")) {
							resultado = resultado.slice(0, -1)
						}

						if (resultado.charAt(resultado.length - 1) == ",") {
							resultado = resultado.slice(0, -1)
						}

					}
					texto = texto.replace(beforeEval, resultado.toString());
				} else if (/\,/.test(resultado)) {
					texto = texto.replace(beforeEval, resultado.toString() + "|" + resultado.toString().replace(/\,/g, ", "));
				}

			}
		}

		if (input) {

	function randomNumber(min, max) {
		var rnd = parseInt(Math.random() * max - min);
		return rnd;
	}


	function randomValue(min, max) {
		var decimalPos = Math.max(min.countDecimals(), max.countDecimals());
		// If both the minimum and maximum values are integers, return a random integer. Don't let the user specify any decimal places.
		if (decimalPos == 0) {

			return Math.floor(Math.random() * (parseInt(max) - parseInt(min) + 1)) + parseInt(min);
		}

		// Otherwise, return a random floating point number with specified decimal places.
		else {

			// Make sure the minimum value is a number.
			if (Number.isNaN(Number.parseFloat(min))) {
				new Error("El valor mínimo no es un número.");
			}

			// Make sure the maximum value is a number.
			if (Number.isNaN(Number.parseFloat(max))) {
				new Error("El valor máximo no es un número.");
			}

			// Generate the floating point number.
			let value = (Math.random() * (parseFloat(max) - parseFloat(min))) + parseFloat(min);
			var decimalPosShow = (decimalPos == 1 ? decimalPos + 1 : decimalPos)
			return Number(parseFloat(value).toFixed(decimalPos)).toFixed(decimalPosShow);

		}
	}

	function maximoComunDivisor(arr) {
		let result = parseInt(arr[0]);
		for (let i = 1; i < arr.length; i++) {
			result = maximoComunDivisorPar(parseInt(arr[i]), parseInt(result));

			if (result == 1) {
				return 1;
			}
		}
		return result;
	}

	function maximoComunDivisorPar(a, b) {
		//Devuelve el MCD de a y b
		let temporal; //Para no perder b
		while (b !== 0) {
			temporal = b;
			b = a % b;
			a = temporal;
		}
		return a;
	}

	function minimoComunMultiplo(arr) {
		let result = parseInt(arr[0]);
		for (let i = 1; i < arr.length; i++) {
			result = minimoComunMultiploPar(parseInt(arr[i]), parseInt(result));

			if (result == 1) {
				return 1;
			}
		}
		return result;
	}

	function reverseArr(arr) {

		arr.sort(function (a, b) { return b - a });
		return arr.toString();
	}

	function minimoComunMultiploPar(a, b) {
		//Devuelve el mcm de a y b
		return (a * b) / maximoComunDivisorPar(a, b);
	}

	function par(a, b) {
		//Devuelve un número par entre a y b
		var pares = [];
		for (var i = a; i <= b; i++) {

			if (i % 2 === 0) {
				pares.push(parseInt(i));
			}
		}
		return pares[randomValue(0, pares.length - 1)];
	}

		var impares = [];
		for (var i = a; i <= b; i++) {

			if (i % 2 === 1) {
				impares.push(parseInt(i));
			}
		}
		return impares[randomValue(0, impares.length - 1)];
	}


	function getPrime(a, b) {
		//Devuelve un número primo entre a y b
		var primos = [];
		var esPrimo;
		for (var i = a; i <= b; i++) {
			if (i == 0 || i == 1 || i == 4) {
				esPrimo = false;
			} else {
				esPrimo = true;

				for (var j = 2; j < i / 2 && esPrimo; j++) {

					if (i % j == 0) esPrimo = false;

					// Si no se pudo dividir por ninguno de los de arriba, sí es primo

				}
			}
			if (esPrimo) primos.push(i);
		}
		return primos[randomValue(0, primos.length - 1)];
	}

	function pow(a, b, c) {
		//Devuelve una potencia de a entre b y c
		var potencias = [];
		var exit = false;
		for (var i = 0; !exit; i++) {
			var pot = Math.pow(a, i)
			if (pot >= b && pot <= c) {
				potencias.push(parseInt(pot));
			} else if (pot > c) {
				exit = true;
			}
		}
		return potencias[randomValue(0, potencias.length - 1)];
	}

	function multiplo(a, b, c) {
		//Devuelve un múltiplo del número a entre b y c
		var multiplos = [];
		var exit = false;
		for (var i = 0; !exit; i++) {
			var mult = a * i;
			if (mult >= b && mult <= c) {
				multiplos.push(parseInt(mult));
			} else if (mult > c) {
				exit = true;
			}
		}
		return multiplos[randomValue(0, multiplos.length - 1)];
	}

		//Devuelve un múltiplo del número a entre b y c
		var divisores = [];
		for (var i = parseInt(b); i < parseInt(c); i++) {

			if (parseInt(a) % i === 0) {
				divisores.push(parseInt(i));
			}
		}
		return divisores[randomValue(0, divisores.length - 1)];
	}

	function generateValues() {
		var data = [];
		for (var i = 0; i < valores.length; i++) {

			var pendingVars = valores[i].match(/\$v\d+/g) || [];
			var auxVars = valores[i];


			valores[i] = [];
			while (valores[i].length < 100 && auxVars) {
				var valAct = auxVars;
				for (var j = 0; j < pendingVars.length; j++) {
					var x = parseInt(pendingVars[j].match(/\d+/)[0]) - 1;
					if (Array.isArray(valores[x])) {
						valAct = valAct.split(pendingVars[j]).join(valores[x][valores[i].length]);
					}
				}
				if (valAct && valAct.charAt(0) == "$") {
					var valorVar = valAct.substring(1);


					if (valorVar.includes(",")) {
						var range = valorVar.split(",");

						var min = parseFloat(range[0]);
						var max = parseFloat(range[1]);

						var val = randomValue(min, max).toString();
						// if(valores[i].indexOf(val) == -1){
						valores[i].push(val);
						// }

					} else {
						var val = parseFloat(valorVar);
						if (val.countDecimals() == 0) {
							valores[i].push(parseInt(val).toString());
						}

					}
				} else if (valAct && valAct.charAt(0) == "%") {
					if (valAct.includes("/")) {
						var valorVar = valAct.substring(1);
						var posibles = valorVar.split("/");
						var val = posibles[randomValue(0, posibles.length - 1)];
						valores[i].push(val.toString());
					}
				} else if (valAct && valAct.charAt(0) == "=") {
					var variables = valAct.match((/\$v\d+/g)) || [];
					var valorVar = valAct.substring(1);
					for (var j = 0; j < variables.length; j++) {
						var varId = parseInt(variables[j].substring(2)) - 1;
						valorVar = valorVar.split(variables[j]).join(valores[varId][valores[i].length]);
					}


					valores[i].push("eval{" + parseFunctions(valorVar) + "}");
				}
			}
		}
		// sessionStorage.setItem('valores'+refpage, data.join('|'));

	}

	function parseFunctions(valorVar) {

		var matches = valorVar.match(/eval\{[^}]+\}/g) || [];
		for (var l = 0; l < matches.length; l++) {
			valorVar = valorVar.replace(matches[l], eval(matches[l].substring(5).replace("}", "")) || matches[l]);
		}

		var mcd = valorVar.match(/mcd\(\d+\,\d+(\,\d+)*\)/) || [];
		var mcm = valorVar.match(/mcm\(\d+\,\d+(\,\d+)*\)/) || [];
		var parF = valorVar.match(/^par\(\d+\,\d+\)/) || [];
		var prim = valorVar.match(/pri\(\d+\,\d+\)/) || [];
		var imparF = valorVar.match(/imp\(\d+\,\d+\)/) || [];
		var pow = valorVar.match(/pow\((\d+|\d+\.\d+)\,(\d+|\d+\.\d+),(\d+|\d+\.\d+)\)/) || [];
		var mult = valorVar.match(/mult\(\d+\,\d+\,\d+\)/) || [];
		var div = valorVar.match(/div\(\d+\,\d+,\d+\)/) || [];
		var divs = valorVar.match(/divs\(\d+\)/) || [];
		var math = valorVar.match(/Math.+\(.+\)/) || [];
		var sort = valorVar.match(/sort\((\d+|\d+\.\d+)\,(\d+|\d+\.\d+)(\,(\d+|\d+\.\d+))*\)/) || [];
		var rev = valorVar.match(/rev\((\d+|\d+\.\d+)\,(\d+|\d+\.\d+)(\,(\d+|\d+\.\d+))*\)/) || [];

		for (var l = 0; l < mcd.length; l++) {
			if (mcd[l] && /mcd/.test(mcd[l])) {
				var valores = mcd[l].match(/\d+/g);

				// var num2 = parseInt(mcd[l].substring(4).split(',')[1].trim());
				valorVar = valorVar.replace(mcd[l], maximoComunDivisor(valores));
			}
		}
		for (var l = 0; l < mcm.length; l++) {
			if (mcm[l] && /mcm/.test(mcm[l])) {
				var valores = mcm[l].match(/(\d+|\d+\.\d+)/g);
				// var num1 = parseInt(mcm[l].substring(4).split(',')[0].trim());
				// var num2 = parseInt(mcm[l].substring(4).split(',')[1].trim());
				valorVar = valorVar.replace(mcm[l], minimoComunMultiplo(valores));
			}
		}
		for (var l = 0; l < parF.length; l++) {
			var num1 = parseInt(parF[l].substring(4).split(',')[0].trim());
			var num2 = parseInt(parF[l].substring(4).split(',')[1].trim());
			valorVar = valorVar.replace(parF[l], par(num1, num2));
		}
		for (var l = 0; l < prim.length; l++) {
			var num1 = parseInt(prim[l].substring(4).split(',')[0].trim());
			var num2 = parseInt(prim[l].substring(4).split(',')[1].trim());
			valorVar = valorVar.replace(prim[l], getPrime(num1, num2));
		}
		for (var l = 0; l < imparF.length; l++) {
			var num1 = parseInt(imparF[l].substring(4).split(',')[0].trim());
			var num2 = parseInt(imparF[l].substring(4).split(',')[1].trim());
			valorVar = valorVar.replace(imparF[l], impar(num1, num2));
		}
		for (var l = 0; l < pow.length; l++) {
			var base = parseInt(pow[l].substring(4).split(',')[0].trim());
			var min = parseInt(pow[l].substring(4).split(',')[1].trim());
			var max = parseInt(pow[l].substring(4).split(',')[2].trim());
			valorVar = valorVar.replace(pow[l], pow(base, min, max));
		}
		for (var l = 0; l < mult.length; l++) {
			var num = parseInt(mult[l].substring(5).split(',')[0].trim());
			var min = parseInt(mult[l].substring(5).split(',')[1].trim());
			var max = parseInt(mult[l].substring(5).split(',')[2].trim());
			valorVar = valorVar.replace(mult[l], multiplo(num, min, max));
		}
		for (var l = 0; l < div.length; l++) {
			var num = parseInt(div[l].substring(4).split(',')[0].trim());
			var min = parseInt(div[l].substring(4).split(',')[1].trim());
			var max = parseInt(div[l].substring(4).split(',')[2].trim());
			valorVar = valorVar.replace(div[l], divisor(num, min, max));
		}
		for (var l = 0; l < divs.length; l++) {
			var num = parseInt(divs[l].match(/(\d+|\d+\.\d+)/)[0].trim());
			valorVar = valorVar.replace(divs[l], divisores(num));
		}
		for (var l = 0; l < math.length; l++) {

			valorVar = valorVar.replace(math[l], eval(math[l]));

		}
		for (var l = 0; l < sort.length; l++) {
			if (sort[l] && /sort/.test(sort[l])) {
				var vals = sort[l].match(/\(.+\)/)[0].replace(/\(|\)/g, "").split(",");

				valorVar = valorVar.replace(sort[l], sortArr(vals));
			}
		}
		for (var l = 0; l < rev.length; l++) {
			if (rev[l] && /rev/.test(rev[l])) {
				var vals = rev[l].match(/\(.+\)/)[0].replace(/\(|\)/g, "").split(",");

				valorVar = valorVar.replace(rev[l], reverseArr(vals));
			}
		}
		return valorVar;
	}

	// ref: http://stackoverflow.com/a/1293163/2343
	// This will parse a delimited string into an array of
	// arrays. The default delimiter is the comma, but this
	// can be overriden in the second argument.
	function CSVToArray(strData, strDelimiter) {
		// Check to see if the delimiter is defined. If not,
		// then default to comma.
		strDelimiter = (strDelimiter || ",");

		// Create a regular expression to parse the CSV values.
		var objPattern = new RegExp(
			(
				// Delimiters.
				"(\\" + strDelimiter + "|\\\\|\\r?\\n|\\r|^)" +

				// Quoted fields.
				"(?:\"([^\"]*(?:\"\"[^\"]*)*)\"|" +

				// Standard fields.
				"([^\"\\" + strDelimiter + "\\r\\n\\\\]*))"
			),
			"gi"
		);


		// Create an array to hold our data. Give the array
		// a default empty first row.
		var arrData = [[]];

		// Create an array to hold our individual pattern
		// matching groups.
		var arrMatches = null;


		// Keep looping over the regular expression matches
		// until we can no longer find a match.
		while (arrMatches = objPattern.exec(strData)) {

			// Get the delimiter that was found.
			var strMatchedDelimiter = arrMatches[1];

			// Check to see if the given delimiter has a length
			// (is not the start of string) and if it matches
			// field delimiter. If id does not, then we know
			// that this delimiter is a row delimiter.
			if (
				strMatchedDelimiter.length &&
				strMatchedDelimiter !== strDelimiter
			) {

				// Since we have reached a new row of data,
				// add an empty row to our data array.
				arrData.push([]);

			}

			var strMatchedValue;

			// Now that we have our delimiter out of the way,
			// let's check to see which kind of value we
			// captured (quoted or unquoted).
			if (arrMatches[2]) {

				// We found a quoted value. When we capture
				// this value, unescape any double quotes.
				strMatchedValue = arrMatches[2].replace(
					new RegExp("\"\"", "g"),
					"\""
				);

			} else {

				// We found a non-quoted value.
				strMatchedValue = arrMatches[3];

			}


			// Now that we have our value string, let's add
			// it to the data array.
			arrData[arrData.length - 1].push(strMatchedValue);
		}

		// Return the parsed data.
		return (arrData);
	}

	function permutaSinRepe(a_reordenar) {

		var array = a_reordenar;
		var currentIndex = array.length, temporaryValue, randomIndex;

		while (0 !== currentIndex) {
			// Pick a remaining element...
			randomIndex = Math.floor(Math.random() * currentIndex);
			currentIndex -= 1;


			// And swap it with the current element.
			temporaryValue = array[currentIndex];
			array[currentIndex] = array[randomIndex];

			array[randomIndex] = temporaryValue;
		}

		return array;
	}

	function saveFeedback(victory) {

		var currentScoreObjTxt = localStorage.getItem('feedbackRetos' + referencia);
		var index = -1;

		var thisScoreObject = {
			refPage: refpage, //ref de página
			tag: quizTag || refpage, //etiqueta
			df: new Date().today(), //fecha último intento
			tf: new Date().timeNow(), //hora último intento
			te: new Date(new Date().getTime() - startTime.getTime()).timeNowUTC(), //Tiempo empleado
			sp: marcadores.scorePoints, //puntos conseguidos
			bs: marcadores.bestScorePoints, //mejor puntuación
			bh: marcadores.bestScoreHits, //mejor número aciertos
			ws: Math.max(...marcadores.scorePoints), //Puntos del ganador
			wh: Math.max(...marcadores.scoreHits), //Puntos del ganador
			rs: [], // Records: puntos
			rp: [], // Records: nombre jugador
			rh: [], // Records: número de aciertos
			wp: marcadores.playerNames[marcadores.scorePoints.indexOf(Math.max(...marcadores.scorePoints))], //Puntos del ganador
			sh: marcadores.scoreHits, //preg Acertadas
			e: marcadores.scoreErrors, //errores
			p: marcadores.playerNames, // playerNames
			w: (victory ? '1' : '0'), //wins
			t: '1' //tries
		};
		thisScoreObject.rs.push(thisScoreObject.ws);
		thisScoreObject.rp.push(thisScoreObject.wp);
		thisScoreObject.rh.push(thisScoreObject.wh);
		if (currentScoreObjTxt && currentScoreObjTxt != "" && currentScoreObjTxt != "undefined") {

			var currentScoreObj = JSON.parse(currentScoreObjTxt);

			index = currentScoreObj.map(object => object.tag).indexOf(thisScoreObject.tag);

			if (index != -1) {
				thisScoreObject.tries = parseInt(currentScoreObj[index].t) + 1;
				thisScoreObject.wins = parseInt(thisScoreObject.w) + (victory ? 1 : 0);
				for (var i = 0; i < currentScoreObj[index].sp.length; i++) {
					thisScoreObject.bh[i] = Math.max(thisScoreObject.bh[i], thisScoreObject.sh[i], parseInt(currentScoreObj[index].bh[i]));
					thisScoreObject.bs[i] = Math.max(thisScoreObject.bs[i], thisScoreObject.sp[i], parseInt(currentScoreObj[index].bs[i]));
				}
				var records = new Map();
				currentScoreObj[index].rs = (Array.isArray(currentScoreObj[index].rs) ? currentScoreObj[index].rs : []);
				currentScoreObj[index].rp = (Array.isArray(currentScoreObj[index].rp) ? currentScoreObj[index].rp : []);
				currentScoreObj[index].rh = (Array.isArray(currentScoreObj[index].rh) ? currentScoreObj[index].rh : []);
				currentScoreObj[index].rs.push(thisScoreObject.rs[0]);
				currentScoreObj[index].rp.push(thisScoreObject.rp[0]);
				currentScoreObj[index].rh.push(thisScoreObject.rh[0]);
				for (var i = 0; i < currentScoreObj[index].rs.length; i++) {
					records.set(currentScoreObj[index].rs[i], [currentScoreObj[index].rp[i], currentScoreObj[index].rh[i]]);
				}
				const mapSort = new Map([...records.entries()].sort((a, b) => b[0] - a[0]));
				thisScoreObject.rp = [];
				thisScoreObject.rh = [];
				thisScoreObject.rs = [...mapSort.keys()];
				for (var i = 0; i < [...mapSort.values()].length; i++) {
					thisScoreObject.rp.push([...mapSort.values()][i][0]);
					thisScoreObject.rh.push([...mapSort.values()][i][1]);
				}

				currentScoreObj.splice(index, 1);
			}
		} else {
			var currentScoreObj = [];
		}

		currentScoreObj.push(thisScoreObject);
		localStorage.setItem('feedbackRetos' + referencia, JSON.stringify(currentScoreObj));
	}

	function getRandomFeedback(texto) {
		var split = texto.split("|");

		if (split.length > 0) {

		} else {
			selFbk = texto;
		}
		return selFbk;
	}

			hpElixir.removeEventListener("click", restoreALLHP, false);

			for (var x = 0; x < grupoVidas.length; x++) {
				grupoVidas[x].style.display = "block";
			}
			hpUser = 0;
			restoreBar();
		}
	}

	function restoreBar() {
		if (barraUsuario) {
			let grupo = barraUsuario.closest('div.genially-animated-wrapper');

			var hayTexto = false;
			bloqueo = true;

			txtBarra = getTexte('progressBarUser');

			var errores = Math.min(hpUser, numVidas);
			console.log("actualizando la barra con digito");
			let idInterval = setInterval(function () {
				var value = parseInt(barraUsuario.getAttribute('data-value'));
				if ((value >= (100 - (errores / numVidas * 100))) || (errores != Math.min(hpUser, numVidas))) {
					clearInterval(idInterval);
					bloqueo = false;
					barraUsuario.value = (100 - (errores / numVidas * 100));

				} else {
					value++;
					barraUsuario.setAttribute('data-value', value);

				}
				if (hayTexto) { txtBarra.innerText = Math.ceil(parseFloat(barraUsuario.value)) + "%"; }

		}

	function restaVidaBoss() {
		calculaGolpe("BOSS");

		if (numVidasBoss > 0 && hp >= numPreguntas) {

				victoria();
				for (var x = 0; x < grupoVidasBoss.length; x++) {
					grupoVidasBoss[x].style.display = "none";
				}

		}
		else {
			setTimeout(function () {

				for (var x = 0; x < Math.min(hp, grupoVidasBoss.length); x++) {
					grupoVidasBoss[x].style.display = "none";
				}
			}, 3000);
		}
		playAudio(audioCorrect);
	}

	function validarRespuestaTxt() {
		if (!bloqueo) {

			var correspondencia = false;
			respuestaTxt = respuestaInput.value.trim();

			if (respuestaTxt != "") {
				bloqueo = true;
				for (var x = 0; x < cuestionario[preguntaActual].respCorrecta.length; x++) {
					if (!/\$q/.test(cuestionario[preguntaActual].respCorrecta[x])) {
						if (respuestaTxt.toUpperCase() === cuestionario[preguntaActual].respCorrecta[x].trim().toUpperCase().replace("\n", "")) { correspondencia = true; }
					} else {

						var respOrig = cuestionario[preguntaActual].respCorrecta[x];
						while (/eval\{/.test(respOrig) && !correspondencia) {
							var matchesAux = respOrig.match(/eval\{[^{}]+\}/g) || []
							var matchTemp;
							for (var j = 0; j < matchesAux.length; j++) {
								matchTemp = matchesAux[j].replace(/^eval\{/g, "");
								matchTemp = matchTemp.replace(/\}$/g, "");
								matchTemp = parseFunctions(matchTemp);
								// matchTemp = matchTemp.replace(/\,/g, ".");
								matchTemp = matchTemp.replace(/\$q/g, respuestaTxt);

								respOrig = respOrig.replace(matchesAux[j], eval(matchTemp));

							}

							if (!/false/.test(respOrig)) { correspondencia = true; }
						}

					}

				}
				if (correspondencia) {
					txtFeedback.innerText = getRandomFeedback(lengua.bien);
					resizeText(txtFeedback);
					correccion.push(1);
					marcadores.hitScore(jugadorActual);
					restaVidaBoss();
					playAudio(audioCorrect);
					// setTimeout(function () {siguientePregunta()},3000);
					opcionMarcada = 5;

				} else {
					txtFeedback.innerText = getRandomFeedback(lengua.incorrecto);
					resizeText(txtFeedback);
					correccion.push(0);
					restaVida();
					opcionMarcada = 5;

					// marcadores.changePlayer();
				}
				actualizaBarras();
			}
			else {
				respuestaInput.focus();
			}


		}
		if (btnNext) { btnNext.setAttribute("used", "false"); }
	}

	function actualizaBarras() {

			txtBarra = getTexte('progressBarUser');

			var errores = Math.min(hpUser, numVidas);
			console.log("actualizando la barra con digito");
			let idInterval = setInterval(function () {
				var value = parseInt(barraUsuario.getAttribute('data-value'));
				if ((value <= (100 - (errores / numVidas * 100))) || (errores != Math.min(hpUser, numVidas))) {
					clearInterval(idInterval);
					bloqueo = false;
					barraUsuario.value = (100 - (errores / numVidas * 100));
				} else {
					value--;
					barraUsuario.setAttribute('data-value', value);
					barraUsuario.style.width = value + "%";
					// bloqueo = true;
				}
				if (hayTexto) { txtBarra.innerText = Math.ceil(parseFloat(barraUsuario.value)) + "%"; }

			}, 50);
			idIntervalGlobal = idInterval;

	function cambiaChrono(evt) {
		var fin = sessionStorage.getItem('finalizaCrono');
		var spellAct = evt.currentTarget;
		var textoAdj = obtenTextoHijo(spellAct);

		spellAct.style.opacity = "0.5";
		spellAct.style.cursor = "default";
		spellAct.setAttribute("used", "true");
		spellAct.removeEventListener("click", cambiaChrono, false);

		var minutos = 1;
		var segundos;
		var horas;
		if (textoAdj.innerText && /(\d\d?:)?\d\d?:\d\d?/.test(textoAdj.innerText)) {
			var timers = textoAdj.innerText.match(/(\d\d?:)?\d\d?:\d\d?/)[0].split(":");
			segundos = timers[timers.length - 1] || 0;
			minutos = timers[timers.length - 2] || 0;
			horas = timers[timers.length - 3] || 0;
		}

		if (fin) {
			var tempFin = parseFloat(fin);
			sessionStorage.setItem('finalizaCrono', tempFin + (segundos * 1000) + (minutos * 60000) + (horas * 3600000));
		}

	}

	function chrono() {

		var inicia = sessionStorage.getItem('iniciaCrono');
		var fin = sessionStorage.getItem('finalizaCrono');
		var horaAct = new Date().getTime();

		if (finishTemp) {
			clearInterval(miTemporizador);
		}
		else if (timerMode == "timer") {
			var diferencia = parseInt(fin) - horaAct;
			if (diferencia <= 0) {
				clearInterval(miTemporizador);
				finishTemp = true;
				diferencia = 0;
				bloqueo = true;
				for (var i = 0; i < timerOFFGr.length; i++) {
					var tOff = timerOFFGr[i];
					tOff.style.display = "block";
				}
				if (gameMode == "quiz" && scoreTarget <= Math.max(...marcadores.scoreHits)) {
					victoria();
				} else {
					derrota();
				}
			}

		} else {

			var diferencia = horaAct - inicia;
		}
		if (!finishTemp) {
			var chrono = dateHMS(diferencia);
			crono.innerHTML = chrono;
		}

	}

	function dateHMS(time) {
		var addZero = function (v) { return v < 10 ? '0' + v : v; };
		var d = new Date(time);
		var t = [];
		if (addZero(d.getUTCHours()) != '00') { t.push(addZero(d.getUTCHours())); }
		t.push(addZero(d.getMinutes()))

		t.push(addZero(d.getSeconds()));
		return t.join(':');
	}

	function inicializaCrono() {
		// console.log('Se inicia el crono');
		var minutos;
		var segundos;
		var horas;
		if (timerSet) {
			var timers = timerSet.split(":");
			segundos = parseInt(timers[timers.length - 1]) || 0;
			minutos = parseInt(timers[timers.length - 2]) || 0;
			horas = parseInt(timers[timers.length - 3]) || 0;
		}
		finishTemp = false;
		if ((minutos + horas + segundos) > 0) {
			timerMode = "timer";
			var inicio = new Date();
			var fin = new Date(inicio.getTime() + (segundos * 1000) + (minutos * 60000) + (horas * 3600000));
			inicio = inicio.getTime();
			sessionStorage.setItem('iniciaCrono', inicio);
			sessionStorage.setItem('finalizaCrono', fin.getTime());

			var chrono = dateHMS(0);
			crono.innerHTML = chrono;
		} else {
			var inicio = new Date();
			timerMode = "crono";
			inicio = inicio.getTime();
			sessionStorage.setItem('iniciaCrono', inicio);
			sessionStorage.removeItem('finalizaCrono');

			var chrono = dateHMS(0);
			crono.innerHTML = chrono;
		}
	}
